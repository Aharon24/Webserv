server {
    listen 127.0.0.1:8082;

    server_name localhost;

    root ./www;
    index index.html;

    client_max_body_size 20M;

    error_page 404 /404.html;

    location / {
        allowed_methods GET POST DELETE;
        autoindex off;
    }

    location /uploads {
        allowed_methods POST;
        upload on;
        upload_path ./uploads;
    }

    location /cgi-bin {
        cgi .py /usr/bin/python3;
    }
}