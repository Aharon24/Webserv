server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;

    root www;
    index index.html;
    client_max_body_size 1048576;

    error_page 404 /errors/404.html;

    location / {
        allowed_methods GET POST DELETE;
        autoindex off;
    }

    location /upload {
        allowed_methods POST;
        upload on;
        upload_path uploads;
    }

    location /cgi {
        cgi .py /usr/bin/python3;
    }

    location /old {
        return 301 /new;
    }
}