server {
    listen 127.0.0.1:8080;

    root /tmp/www;

    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;

    client_max_body_size 10M;

    location / {
        allowed_methods GET;
        index index.html;
        autoindex off;
    }

    location /upload {
        allowed_methods POST;
        upload on;
        upload_path /tmp/uploads;
    }

    location /old {
        return 301 /new;
    }

    location /cgi {
        allowed_methods GET POST;
        cgi .py /usr/bin/python3;
    }
}


